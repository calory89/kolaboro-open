name: ci

# Every push, every pull request, and once a day against production data.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifiers:
    name: JS, Python and Go verifiers agree
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22'
          cache: false
      - name: Go vet
        working-directory: open/go
        run: go vet ./...
      - name: Test vectors, plus tampered copies every verifier must reject
        run: python3 ci/agree.py vectors
      - name: Live production data on kolaboro.com
        run: python3 ci/agree.py live
      - name: Every file is byte-identical to the copy served on kolaboro.com
        run: python3 ci/same-as-live.py

  scoring:
    name: Scoring rules (published projects, property tests, mutation check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: JavaScript scoring reproduces every published project (downloads live data)
        run: node p/whatif.test.js
      - name: Property tests, Python (Hypothesis)
        run: python3 tests/property/props.py --examples 2000 --json out-py.json
      - name: Property tests and differential fuzzing, JavaScript (fast-check) against Python
        run: node tests/property/props.test.js --runs 2000 --json out-js.json
      - name: Mutation check (planted bugs must be caught)
        run: python3 ci/mutation.py --examples 300 --json out-mutation.json
      - name: Results file
        run: python3 ci/property-report.py out-py.json out-js.json out-mutation.json property-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: property-tests
          path: property-tests.json

  privacy:
    name: Secrets and privacy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --exit-code 1 .
      - name: E-mail addresses, phone numbers, outside links, credentials
        run: python3 ci/privacy-scan.py

name: release

# Push a tag like v1.0.0. The workflow runs the full CI, builds a reproducible source tarball from the tagged commit,
# records SLSA build provenance for it (Sigstore, via GitHub artifact attestations) and attaches both to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance with a short-lived Sigstore certificate
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "Build tarball (deterministic: git archive of the tagged tree, fixed mtime, gzip -n)"
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          git -c tar.umask=022 archive --format=tar --prefix="kolaboro-open-${V}/" --mtime="$(git log -1 --format=%cI)" HEAD | gzip -n -9 > "dist/kolaboro-open-${V}.tar.gz"
          (cd dist && sha256sum "kolaboro-open-${V}.tar.gz" > "kolaboro-open-${V}.tar.gz.sha256" && cat ./*.sha256)
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/kolaboro-open-*.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Source tarball with SLSA build provenance. Verify: gh attestation verify kolaboro-open-${GITHUB_REF_NAME}.tar.gz --repo ${GITHUB_REPOSITORY}"
